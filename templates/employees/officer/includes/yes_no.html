<div class="yn">
  <label>
    <input
      {% if field.value == "1" %}checked{% endif %}
      name="{{ field.html_name }}"
      type="radio"
      value="1"
    >
    Yes
  </label>
  <label>
    <input
      {% if field.value == "0" %}checked{% endif %}
      name="{{ field.html_name }}"
      type="radio"
      value="0"
    >
    No
  </label>
</div>
