{# djlint:off H021 #}
{% load static %}

<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Sign in · {{ site_name }}</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    <link href="{% static 'css/fieldops.css' %}" rel="stylesheet">
  </head>
  <body>
    <div class="login">
      <div class="card">
        <div class="brand">
          <span class="logo">{{ site_name|slice:":1" }}</span>
          <span>{{ site_name }}<small>Workforce &amp; job management</small></span>
        </div>
        <h1 style="font-size:20px">Sign in</h1>
        <p class="muted small" style="margin:4px 0 22px">Managers go to the dashboard, officers to their jobs.</p>
        {% if form.errors %}
          <div class="msgs">
            <div class="msg error">Username or password not recognised.</div>
          </div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="field">
            <label for="u">Username</label>
            <input id="u" autocomplete="username" autofocus name="username">
          </div>
          <div class="field">
            <label for="p">Password</label>
            <input
              id="p"
              autocomplete="current-password"
              name="password"
              type="password"
            >
          </div>
          <input name="next" type="hidden" value="{{ next }}">
          <button
            class="btn primary block"
            style="padding:10px;
                   margin-top:6px"
            type="submit"
          >Sign in</button>
        </form>
      </div>
    </div>
  </body>
</html>
