{% extends "allauth/layouts/base.html" %}

{% comment %} djlint:off {% endcomment %}
{% block page_content %}
<div class="uk-section uk-section-large uk-flex uk-flex-middle uk-flex-center uk-flex-auto">
  <div class="uk-container uk-width-1-1">
    <div class="uk-flex uk-flex-center" uk-grid>
      <div class="uk-width-1-1 uk-width-4-5@s uk-width-2-3@m uk-width-1-2@l">
        <div class="uk-card uk-card-default uk-card-body uk-border-rounded uk-box-shadow-small uk-padding-large">
          
          <div class="uk-text-center">
            {% block entrance_content %} {% endblock entrance_content %}
          </div>

          <div class="uk-text-center uk-margin-top">
            {% block redirect_link %}
            <a
              href="{% url 'intake:form_intake' %}"
              class="uk-link-muted uk-text-small uk-text-decoration-none"
            >
              ← Back to homepage
            </a>
            {% endblock redirect_link %}
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
