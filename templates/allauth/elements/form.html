{% load allauth %}

{% comment %} djlint:off {% endcomment %}
<form method="{{ attrs.method }}" class="uk-form-stacked uk-text-left"
      {% if attrs.action %}action="{{ attrs.action }}"{% endif %}>
    {% slot body %}
    {% endslot %}
    <div class="uk-text-center uk-margin-top">
        {% slot actions %}
        {% endslot %}
    </div>
</form>
